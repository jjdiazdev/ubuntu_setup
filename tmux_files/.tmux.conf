# Scroll y selección con mouse/dedo
set -g mouse on

# Historial amplio (Claude genera mucha salida)
set -g history-limit 50000

# Respuesta inmediata a la tecla Esc (Claude la usa para interrumpir)
set -sg escape-time 10

# Colores correctos
set -g default-terminal "tmux-256color"

# Ventanas numeradas desde 1 (más cómodo en teclado móvil)
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Barra de estado: nombre de sesión a la izquierda
set -g status-left-length 30
set -g status-left "#[bold] #S │ "

# Modo copia con teclas estilo vi
setw -g mode-keys vi

# Como en Vim: v empieza la selección, y copia (Espacio y Enter siguen funcionando)
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel
bind -T copy-mode-vi C-v send -X rectangle-toggle

# Portapapeles del PC (Wayland): lo usan Enter, y, y soltar el arrastre del mouse
set -s copy-command 'wl-copy'

# Portapapeles del terminal cliente vía OSC 52 (para el celular por SSH)
set -s set-clipboard on

# Complementos (TPM): guardar y restaurar sesiones a mano
# Ctrl+b Ctrl+s guarda · Ctrl+b Ctrl+r restaura
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Restaurar también el texto visible de cada panel
set -g @resurrect-capture-pane-contents 'on'

# Debe ser siempre la última línea del archivo
run '~/.tmux/plugins/tpm/tpm'
